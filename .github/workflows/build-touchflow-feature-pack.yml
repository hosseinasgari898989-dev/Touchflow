name: Build TouchFlow R1 (JUnit + assembleDebug)

on:
  push:
    branches:
      - 'feature/touchflow-r1-recording-actions-2026-11-20'
    paths:
      - 'TouchFlow-R1-source.tar.xz'
      - '.github/workflows/build-touchflow-feature-pack.yml'

permissions:
  contents: read

env:
  ARCHIVE: TouchFlow-R1-source.tar.xz
  ARCHIVE_SHA256: 4e0e00918e0b3f172d02daa9262d1d2da3c130872583bcc726aabd5ac35e12d3
  PROJECT_DIR: GrandmaConnectNative
  EXPECTED_PACKAGE: com.grandmaconnect.feature
  EXPECTED_LABEL: TouchFlow
  EXPECTED_TESTS: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify archive hash
        run: |
          test -s "$ARCHIVE"
          echo "$ARCHIVE_SHA256  $ARCHIVE" | sha256sum -c -

      - name: Extract source (no source patching)
        run: |
          tar -xf "$ARCHIVE"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "Test sources Gradle will see:"
          find "$PROJECT_DIR/app/src/test" -name '*.kt' | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: JUnit
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" testDebugUnitTest

      - name: Assert exact test count and zero failures
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET
          root = os.environ["PROJECT_DIR"] + "/app/build/test-results/testDebugUnitTest/*.xml"
          expected = int(os.environ["EXPECTED_TESTS"])
          total = failed = errors = skipped = 0
          lines = []
          for path in sorted(glob.glob(root)):
              suite = ET.parse(path).getroot()
              t = int(suite.get("tests", 0)); f = int(suite.get("failures", 0))
              e = int(suite.get("errors", 0)); s = int(suite.get("skipped", 0))
              total += t; failed += f; errors += e; skipped += s
              lines.append(f"{suite.get('name')}: tests={t} failures={f} errors={e} skipped={s}")
          lines.append(f"TOTAL: tests={total} failures={failed} errors={errors} skipped={skipped} expected={expected}")
          open("test-summary.txt", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if total != expected or failed or errors or skipped:
              sys.exit("Unexpected JUnit result (see test-summary.txt)")
          PY

      - name: assembleDebug
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify package, label, signature, permissions
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/aapt2" dump badging "$APK" > badging.txt
          head -5 badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" badging.txt
          grep -q "application-label:'$EXPECTED_LABEL'" badging.txt

          "$BT/apksigner" verify --verbose --print-certs "$APK" > signature.txt
          cat signature.txt
          grep -q '^Verifies' signature.txt

          sha256sum "$APK" > apk.sha256
          cat apk.sha256

          grep -q 'canRetrieveWindowContent="false"' "$PROJECT_DIR/app/src/main/res/xml/accessibility_service_config.xml"

          grep -E "^uses-(implied-)?permission" badging.txt > permissions-raw.txt || true
          grep -oE "^uses-permission: name='[^']+'" badging.txt | sed -E "s/.*name='([^']+)'/\1/" | sort -u > permissions.txt || true
          printf '%s\n' 'android.permission.POST_NOTIFICATIONS' | sort -u > permissions.allowlist

          echo "--- permissions found ---"
          cat permissions.txt
          if ! diff -u permissions.allowlist permissions.txt; then
            echo "::error::APK permissions differ from the allowlist"
            exit 1
          fi
          if grep -q '^uses-implied-permission' permissions-raw.txt; then
            echo "::error::Unexpected implied permission"
            cat permissions-raw.txt
            exit 1
          fi

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchflow-r1-build
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
            ${{ env.PROJECT_DIR }}/app/build/test-results/testDebugUnitTest/
            test-summary.txt
            badging.txt
            signature.txt
            apk.sha256
            permissions.txt
            permissions.allowlist
            permissions-raw.txt
          if-no-files-found: warn
          retention-days: 30
