name: Build TouchFlow Integration Preview

on:
  push:
    branches:
      - feature/touchflow-webview-integration-20261119
    paths:
      - '.touchflow-native/READY'

permissions:
  contents: read

jobs:
  build-touchflow-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify native source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s .touchflow-native/READY
          cat .touchflow-native/chunk-* > /tmp/touchflow-src.tar.xz.b64
          base64 --decode /tmp/touchflow-src.tar.xz.b64 > /tmp/touchflow-src.tar.xz
          echo '2eea627384e19226856af0a7f8db3c73f147bcfa63b883b45eaf59c64eadd381  /tmp/touchflow-src.tar.xz' | sha256sum -c -
          tar -tJf /tmp/touchflow-src.tar.xz >/dev/null
          tar -xJf /tmp/touchflow-src.tar.xz -C /tmp
          test -f /tmp/GrandmaConnectNative/settings.gradle.kts
          test -f /tmp/GrandmaConnectNative/app/src/main/assets/touchflow/index.html
          test -f /tmp/GrandmaConnectNative/app/src/main/java/com/grandmaconnect/TouchFlowBridge.kt
          test -f /tmp/GrandmaConnectNative/app/src/main/java/com/grandmaconnect/TouchFlowMacroMetadata.kt

      - name: Isolate preview app identity
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/applicationIdSuffix = ".debug"/applicationIdSuffix = ".preview"/' /tmp/GrandmaConnectNative/app/build.gradle.kts
          sed -i 's/versionNameSuffix = "-debug"/versionNameSuffix = "-preview"/' /tmp/GrandmaConnectNative/app/build.gradle.kts
          sed -i 's#<string name="app_name">TouchFlow</string>#<string name="app_name">TouchFlow Preview</string>#' /tmp/GrandmaConnectNative/app/src/main/res/values/strings.xml
          grep -F 'applicationIdSuffix = ".preview"' /tmp/GrandmaConnectNative/app/build.gradle.kts
          grep -F 'versionNameSuffix = "-preview"' /tmp/GrandmaConnectNative/app/build.gradle.kts
          grep -F 'TouchFlow Preview' /tmp/GrandmaConnectNative/app/src/main/res/values/strings.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p /tmp/GrandmaConnectNative assembleDebug

      - name: Verify preview APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/GrandmaConnectNative/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -F "package: name='com.grandmaconnect.preview'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -F "application-label:'TouchFlow Preview'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload TouchFlow preview APK
        uses: actions/upload-artifact@v4
        with:
          name: touchflow-integration-preview-apk
          path: /tmp/GrandmaConnectNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified source archive
        uses: actions/upload-artifact@v4
        with:
          name: touchflow-integration-source
          path: /tmp/touchflow-src.tar.xz
          if-no-files-found: error
          retention-days: 30
