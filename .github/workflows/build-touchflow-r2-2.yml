name: Build TouchFlow R2.2 Timeline (JUnit + assembleDebug)

on:
  push:
    branches:
      - 'feature/touchflow-r2-2-timeline-2026-11-20'
    paths:
      - 'TouchFlow-R2-1-source.tar.xz'
      - '.github/patches/r2-2-timeline.patch.xz.b64'
      - '.github/patches/r2-2-timeline.patch.xz.b64.part-*'
      - '.github/workflows/build-touchflow-r2-2.yml'

permissions:
  contents: read

env:
  ARCHIVE: TouchFlow-R2-1-source.tar.xz
  ARCHIVE_SHA256: 9912a5def4851a5a2d18d9a63ba12b51170e4edcce82b7bdf01ceae211df350d
  PATCH_XZ_SHA256: 66c2bd66e4dfa9a2ed79179b5f4d4e138de4a29975a4b440555937c481bd18bf
  PATCH_SHA256: 7618d4e80208dca49343c5ba9c58f952274277b1c8579cd0ac7bca2f9c06b31f
  PROJECT_DIR: GrandmaConnectNative
  EXPECTED_PACKAGE: com.grandmaconnect.feature
  EXPECTED_LABEL: TouchFlow
  EXPECTED_TESTS: '55'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify accepted R2.1 source archive
        run: |
          test -s "$ARCHIVE"
          echo "$ARCHIVE_SHA256  $ARCHIVE" | sha256sum -c -

      - name: Extract R2.1 source
        run: |
          tar -xf "$ARCHIVE"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "Test sources Gradle will see:"
          find "$PROJECT_DIR/app/src/test" -name '*.kt' | sort

      # This inherited R1/R2.1 test-fixture correction applies to the extracted
      # test workspace only; production source and the original archive stay unchanged.
      - name: Correct inherited SearchRules test fixture only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("GrandmaConnectNative/app/src/test/java/com/grandmaconnect/SearchRulesTest.kt")
          old = 'SearchRules.matches("چت تلگرام", "تلگرام", "org.telegram.chat")'
          new = 'SearchRules.matches("chat تلگرام", "تلگرام", "org.telegram.chat")'
          source = p.read_text(encoding="utf-8")
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one inherited fixture, found {count}")
          p.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          grep -F 'SearchRules.matches("chat تلگرام", "تلگرام", "org.telegram.chat")' "$PROJECT_DIR/app/src/test/java/com/grandmaconnect/SearchRulesTest.kt"
          ! grep -F 'SearchRules.matches("چت تلگرام", "تلگرام", "org.telegram.chat")' "$PROJECT_DIR/app/src/test/java/com/grandmaconnect/SearchRulesTest.kt"

      - name: Verify and apply R2.2 source patch
        run: |
          cat .github/patches/r2-2-timeline.patch.xz.b64.part-* | tr -d '\r\n' > r2-2-timeline.patch.xz.b64
          test "$(wc -c < r2-2-timeline.patch.xz.b64)" -eq 19336
          base64 -d r2-2-timeline.patch.xz.b64 > r2-2-timeline.patch.xz
          echo "$PATCH_XZ_SHA256  r2-2-timeline.patch.xz" | sha256sum -c -
          xz -dc r2-2-timeline.patch.xz > r2-2-timeline.patch
          echo "$PATCH_SHA256  r2-2-timeline.patch" | sha256sum -c -
          git apply --check r2-2-timeline.patch
          git apply r2-2-timeline.patch
          git diff --check
          git status --short

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: JUnit
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" testDebugUnitTest

      - name: Assert exact JUnit count and zero failures
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET
          root = os.environ["PROJECT_DIR"] + "/app/build/test-results/testDebugUnitTest/*.xml"
          expected = int(os.environ["EXPECTED_TESTS"])
          total = failed = errors = skipped = 0
          lines = []
          for path in sorted(glob.glob(root)):
              suite = ET.parse(path).getroot()
              t = int(suite.get("tests", 0))
              f = int(suite.get("failures", 0))
              e = int(suite.get("errors", 0))
              s = int(suite.get("skipped", 0))
              total += t
              failed += f
              errors += e
              skipped += s
              lines.append(f"{suite.get('name')}: tests={t} failures={f} errors={e} skipped={s}")
          lines.append(f"TOTAL: tests={total} failures={failed} errors={errors} skipped={skipped} expected={expected}")
          with open("test-summary.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if total != expected or failed or errors or skipped:
              sys.exit("Unexpected JUnit result (see test-summary.txt)")
          PY

      - name: assembleDebug
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Verify package, label, signature, permissions and privacy flag
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/aapt2" dump badging "$APK" > badging.txt
          head -5 badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE'" badging.txt
          grep -q "application-label:'$EXPECTED_LABEL'" badging.txt

          "$BT/apksigner" verify --verbose --print-certs "$APK" > signature.txt
          cat signature.txt
          grep -q '^Verifies' signature.txt
          sha256sum "$APK" > apk.sha256
          cat apk.sha256

          grep -q 'canRetrieveWindowContent="false"' "$PROJECT_DIR/app/src/main/res/xml/accessibility_service_config.xml"

          grep -E "^uses-(implied-)?permission" badging.txt > permissions-raw.txt || true
          grep -oE "^uses-permission: name='[^']+'" badging.txt | sed -E "s/.*name='([^']+)'/\1/" | sort -u > permissions.txt || true
          printf '%s\n' 'android.permission.POST_NOTIFICATIONS' | sort -u > permissions.allowlist
          echo "--- permissions found ---"
          cat permissions.txt
          if ! diff -u permissions.allowlist permissions.txt; then
            echo "::error::APK permissions differ from the allowlist"
            exit 1
          fi
          if grep -q '^uses-implied-permission' permissions-raw.txt; then
            echo "::error::Unexpected implied permission"
            cat permissions-raw.txt
            exit 1
          fi

      - name: Package exact patched source snapshot
        run: |
          tar -cJf TouchFlow-R2-2-source.tar.xz "$PROJECT_DIR"
          sha256sum TouchFlow-R2-2-source.tar.xz > source.sha256
          cat source.sha256

      - name: Upload APK, source and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchflow-r2-2-build
          path: |
            GrandmaConnectNative/app/build/outputs/apk/debug/app-debug.apk
            GrandmaConnectNative/app/build/reports/tests/testDebugUnitTest/
            GrandmaConnectNative/app/build/test-results/testDebugUnitTest/
            TouchFlow-R2-2-source.tar.xz
            source.sha256
            test-summary.txt
            badging.txt
            signature.txt
            apk.sha256
            permissions.txt
            permissions.allowlist
            permissions-raw.txt
          if-no-files-found: warn
          retention-days: 30
