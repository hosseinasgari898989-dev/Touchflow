name: Build Grandma Connect APK

on:
  push:
    branches: [feature/expanded-capture-settings-2026-11-19]
    paths:
      - '.source-v2/READY'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify native source archive
        run: |
          test -s .source-v2/READY
          cat .source-v2/part-* > /tmp/source-v2.b64
          base64 --decode /tmp/source-v2.b64 > GrandmaConnectNative-source-v2.tar.xz
          tar -tJf GrandmaConnectNative-source-v2.tar.xz >/dev/null
          tar -xJf GrandmaConnectNative-source-v2.tar.xz
          test -f GrandmaConnectNative/settings.gradle.kts
          test -f GrandmaConnectNative/app/src/main/java/com/grandmaconnect/MacroSettings.kt

      - name: Isolate preview app identity
        run: |
          sed -i 's/applicationIdSuffix = ".debug"/applicationIdSuffix = ".preview"/' GrandmaConnectNative/app/build.gradle.kts
          sed -i 's/versionNameSuffix = "-debug"/versionNameSuffix = "-preview"/' GrandmaConnectNative/app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".preview"' GrandmaConnectNative/app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p GrandmaConnectNative assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grandma-connect-expanded-capture-debug-apk
          path: GrandmaConnectNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reproducible source archive
        uses: actions/upload-artifact@v4
        with:
          name: grandma-connect-expanded-capture-source
          path: GrandmaConnectNative-source-v2.tar.xz
          if-no-files-found: error
          retention-days: 30
