name: Build Grandma Connect APK

on:
  push:
    branches: [main, feature/expanded-capture-settings-2026-11-19]
    paths:
      - 'GrandmaConnectNative-source.zip'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract native project
        run: |
          test -s GrandmaConnectNative-source.zip
          unzip -q GrandmaConnectNative-source.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p GrandmaConnectNative assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grandma-connect-debug-apk
          path: GrandmaConnectNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
