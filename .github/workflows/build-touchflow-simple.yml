name: Build TouchFlow Simple Preview

on:
  push:
    branches:
      - feature/touchflow-simple-runner-2026-11-19
    paths:
      - '.touchflow-simple/READY'
      - '.github/workflows/build-touchflow-simple.yml'

permissions:
  contents: read

jobs:
  build-touchflow-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify native source
        shell: bash
        run: |
          set -euo pipefail
          test -s .touchflow-simple/READY
          cat .touchflow-simple/part-* > /tmp/touchflow-simple.tar.xz.b64
          base64 --decode /tmp/touchflow-simple.tar.xz.b64 > /tmp/touchflow-simple.tar.xz
          echo 'e126faff468ef5fd56081b4894d1e6e38bd410ed534fa98de9b7a901705ec856  /tmp/touchflow-simple.tar.xz' | sha256sum -c -
          tar -tJf /tmp/touchflow-simple.tar.xz >/dev/null
          mkdir -p /tmp/touchflow-source
          tar -xJf /tmp/touchflow-simple.tar.xz -C /tmp/touchflow-source
          test -f /tmp/touchflow-source/GrandmaConnectNative/settings.gradle.kts
          test -f /tmp/touchflow-source/GrandmaConnectNative/app/src/main/java/com/grandmaconnect/MainActivity.kt
          test -f /tmp/touchflow-source/GrandmaConnectNative/app/src/main/java/com/grandmaconnect/MacroAccessibilityService.kt
          test -f /tmp/touchflow-source/GrandmaConnectNative/app/src/main/res/values/strings.xml

      - name: Isolate app identity for safe side-by-side install
        shell: bash
        run: |
          set -euo pipefail
          APP=/tmp/touchflow-source/GrandmaConnectNative/app
          sed -i 's/applicationIdSuffix = ".debug"/applicationIdSuffix = ".simple"/' "$APP/build.gradle.kts"
          sed -i 's/versionNameSuffix = "-debug"/versionNameSuffix = "-simple"/' "$APP/build.gradle.kts"
          grep -F 'applicationIdSuffix = ".simple"' "$APP/build.gradle.kts"
          grep -F 'versionNameSuffix = "-simple"' "$APP/build.gradle.kts"
          grep -F '<string name="app_name">TouchFlow</string>' "$APP/src/main/res/values/strings.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p /tmp/touchflow-source/GrandmaConnectNative assembleDebug

      - name: Verify APK package, label and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/touchflow-source/GrandmaConnectNative/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -F "package: name='com.grandmaconnect.simple'"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -F "application-label:'TouchFlow'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload TouchFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: touchflow-simple-preview-apk
          path: /tmp/touchflow-source/GrandmaConnectNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified source archive
        uses: actions/upload-artifact@v4
        with:
          name: touchflow-simple-native-source
          path: /tmp/touchflow-simple.tar.xz
          if-no-files-found: error
          retention-days: 30
